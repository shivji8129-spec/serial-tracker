      <div><label>Branch</label><input id="stBranch" list="brList2" value="${esc(s ? s.branch || '' : '')}"></div>
    </div>
    <datalist id="brList2">${CONFIG.BRANCHES.map(b => `<option value="${esc(b)}">`).join('')}</datalist>
    <div><label>${s ? 'Reset PIN (leave blank to keep the current one)' : 'Starting PIN (4–6 digits)'}</label>
      <input id="stPin" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password"></div>
    <div class="muted small">They will be asked to choose their own PIN at first sign-in.${s ? ' Resetting a PIN signs them out everywhere.' : ''}</div>
    ${s ? `<label class="inline"><input type="checkbox" id="stActive" ${s.active ? 'checked' : ''}> Active (untick to block sign-in)</label>` : ''}
    <div class="row" style="justify-content:flex-end"><button class="btn" onclick="closeDlg()">Cancel</button>
      <button class="btn pri" id="stOk">Save</button></div></div>`);
  $('#stRole').value = s ? s.role : 'warehouse';
  $('#stOk').onclick = async () => {
    const pin = $('#stPin').value.trim();
    if (pin && !/^\d{4,6}$/.test(pin)) return toast('PIN must be 4 to 6 digits', 'warn');
    const { data, error } = await S.sb.rpc('admin_staff_save', { p_id: s ? s.id : null, p_name: $('#stName').value, p_role: $('#stRole').value,
      p_branch: $('#stBranch').value, p_active: s ? $('#stActive').checked : true, p_pin: pin || null });
    if (error) return apiFail(error);
    if (!data.ok) return toast(data.error, 'err', 4500);
    closeDlg(); toast('Staff saved', 'ok');
    if (s && s.id === S.me.id && pin) return checkSession();
    adminStaff();
  };
}

/* ----- product rules ----- */
async function adminRules() {
  const [{ data, error }, { data: recent }] = await Promise.all([
    S.sb.from('product_rules').select('*').order('sort').order('label'),
    S.sb.from('serials').select('serial,product').order('scanned_at', { ascending: false }).limit(400)]);
  const box = $('#adminBody'); if (!box) return;
  if (error) { box.innerHTML = `<div class="alert err">${ic('warn')}<span>${esc(error.message)}</span></div>`; return; }
  S.rules = data; S.recentSerials = recent || [];
  box.innerHTML = `<div class="row" style="margin-bottom:12px;flex-wrap:nowrap"><div class="grow"><div class="listhead" style="margin:0">Product rules <span class="cnt">${data.length}</span></div>
      <div class="muted small">Which products need a serial, and what a valid serial looks like.</div></div>
      <button class="btn pri" style="flex:none" onclick="ruleDlg()">${ic('plus')}Add rule</button></div>
    <div class="card" style="padding:0;margin-bottom:12px">${data.length ? data.map((r, i) => `
      <button class="rulerow ${r.active ? '' : 'off'}" onclick="ruleDlg(${i})">
        <span class="grow"><span class="row" style="gap:8px"><b>${esc(r.label)}</b>
          ${r.needs_serial ? '<span class="badge ok">Needs serial</span>' : '<span class="badge">No serial</span>'}${r.active ? '' : '<span class="badge">Off</span>'}</span>
          <span class="muted small" style="display:block;margin-top:3px">Matches: ${esc(r.keywords)}</span>
          ${r.serial_pattern ? `<span class="muted small" style="display:block">Format <span class="mono">${esc(r.serial_pattern)}</span></span>` : ''}</span>
        ${ic('edit')}</button>`).join('') : '<div class="empty">No rules yet. Add one for inverters and batteries.</div>'}</div>
    <details class="card fold"><summary><b>Test a product</b>${ic('chev')}</summary>
      <div class="stack" style="margin-top:10px">
      <div class="grid2 keep"><div><label>Product name</label><input id="tsProd" placeholder="Deye SUN-6K-SG04LP1"></div>
        <div><label>Serial</label><input id="tsSn" placeholder="2304150123"></div></div>
      <div id="tsOut" class="small muted">Type a product name to see which rule it uses.</div></div></details>
    <details class="card fold small" style="margin-top:10px"><summary><b>How rules work</b>${ic('chev')}</summary>
      <div style="margin-top:8px">A product uses the first active rule (lowest order number) whose keyword starts a word in its name. Serial format examples:</div>
      <dl class="roles">
        <dt class="mono">^\\d{10}$</dt><dd>Exactly 10 digits</dd>
        <dt class="mono">^[A-Z0-9]{12,16}$</dt><dd>12 to 16 letters or digits</dd>
        <dt class="mono">^23</dt><dd>Starts with 23</dd>
      </dl><div class="muted">Leave the format blank to accept any serial.</div></details>`;
  const test = () => {
    const p = $('#tsProd').value, sn = extractSerial($('#tsSn').value), r = ruleFor(p);
    $('#tsOut').innerHTML = !p ? 'Type a product name to see which rule it uses.' : !r ? 'No rule matches. This product <b>does not need a serial</b>.'
      : `Uses <b>${esc(r.label)}</b> · ${r.needs_serial ? 'needs serial' : 'no serial'}` +
        (sn ? ` · serial ${patternOk(r, sn) ? '<span class="badge ok">valid</span>' : '<span class="badge bad">rejected</span>'}` : '');
  };
  $('#tsProd').oninput = test; $('#tsSn').oninput = test;
}
function ruleDlg(i) {
  const r = i == null ? { id: '', label: '', keywords: '', needs_serial: true, serial_pattern: '', sort: 100, active: true } : S.rules[i];
  const samples = r.id ? (S.recentSerials || []).filter(x => { const rr = ruleFor(x.product); return rr && rr.id === r.id; }).slice(0, 4).map(x => x.serial) : [];
  openDlg(`<div class="stack"><h3>${r.id ? 'Edit rule' : 'Add rule'}</h3>
    <div class="grid2 keep"><div><label>Name</label><input id="ruLabel" value="${esc(r.label)}" placeholder="Inverter"></div>
      <div><label>Order</label><input id="ruSort" type="number" value="${r.sort ?? 100}"></div></div>
    <div><label>Keywords (comma separated)</label><input id="ruKw" value="${esc(r.keywords)}" placeholder="inverter, sun-"></div>
    <div><label>Serial format (optional)</label><input id="ruPat" class="mono" value="${esc(r.serial_pattern || '')}" placeholder="Any serial"></div>
    ${samples.length ? `<div class="small muted">Recent serials: <span class="mono">${samples.map(esc).join(' · ')}</span></div>` : ''}
    <div class="row" style="gap:18px"><label class="inline"><input type="checkbox" id="ruNeed" ${r.needs_serial ? 'checked' : ''}> Needs serial</label>
      <label class="inline"><input type="checkbox" id="ruAct" ${r.active ? 'checked' : ''}> Active</label></div>
    <div class="row">${r.id ? '<button class="btn danger" id="ruDel">Delete</button>' : ''}<div class="grow"></div>
      <button class="btn" onclick="closeDlg()">Cancel</button><button class="btn pri" id="ruOk">Save</button></div></div>`);
  $('#ruOk').onclick = async () => {
    const row = { label: $('#ruLabel').value.trim(), keywords: $('#ruKw').value.trim(), needs_serial: $('#ruNeed').checked,
      active: $('#ruAct').checked, sort: parseInt($('#ruSort').value, 10) || 100, serial_pattern: $('#ruPat').value.trim() || null };
    if (!row.label || !row.keywords) return toast('Name and keywords are required', 'warn');
    if (row.serial_pattern) { try { new RegExp(row.serial_pattern); } catch (e) { return toast('Serial format is not a valid pattern', 'err'); } }
    const { error } = r.id ? await S.sb.from('product_rules').update(row).eq('id', r.id) : await S.sb.from('product_rules').insert(row);
    if (error) return apiFail(error);
    closeDlg(); toast('Rule saved', 'ok'); await loadRules(); adminRules();
  };
  if ($('#ruDel')) $('#ruDel').onclick = async () => {
    if (!confirm('Delete this rule? Products that matched it will no longer need serials.')) return;
    const { error } = await S.sb.from('product_rules').delete().eq('id', r.id);
    if (error) return apiFail(error);
    closeDlg(); toast('Rule deleted'); await loadRules(); adminRules();
  };
}

/* ----- activity log ----- */
const TBL = { slips: 'slip', slip_lines: 'slip line', serials: 'serial', product_rules: 'product rule', staff: 'staff member' };
const FIELD = { customer_name: 'Customer', customer_phone: 'Phone', customer_address: 'Address', slip_ref: 'Slip ref', so_ref: 'Sales order',
  slip_date: 'Date', product: 'Product', qty: 'Qty', needs_serial: 'Needs serial', status: 'Status', delivered_at: 'Delivered', receiver_name: 'Receiver',
  serial: 'Serial', notes: 'Notes', role: 'Role', active: 'Active', name: 'Name', keywords: 'Keywords', serial_pattern: 'Serial format' };
const VERB = { insert: 'added', update: 'changed', delete: 'deleted' };
function shortVal(v) { if (v == null) return '—'; const s = typeof v === 'object' ? JSON.stringify(v) : String(v); return s.length > 40 ? s.slice(0, 40) + '…' : s; }
async function adminActivity() {
  const { data, error } = await S.sb.from('audit_log').select('*').order('at', { ascending: false }).limit(300);
  const box = $('#adminBody'); if (!box) return;
  if (error) { box.innerHTML = `<div class="alert err">${ic('warn')}<span>${esc(error.message)}</span></div>`; return; }
  S.activity = data;
  box.innerHTML = `<input id="actF" type="search" placeholder="Filter by staff, slip or serial" style="margin-bottom:10px"><div class="card" id="actList" style="padding:4px 14px"></div>`;
  const draw = () => {
    const f = $('#actF').value.trim().toLowerCase();
    const rows = S.activity.filter(a => !f || [a.staff_name, a.label, a.tbl, a.action].join(' ').toLowerCase().includes(f));
    let lastDay = '';
    $('#actList').innerHTML = rows.length ? rows.map(a => {
      let sum = '';
      if (a.action === 'update' && a.details) sum = Object.entries(a.details).filter(([k]) => k !== 'id')
        .map(([k, v]) => { const n = FIELD[k] || k.replace(/_/g, ' ');
          return Array.isArray(v) && v.length === 2 ? `${esc(n)}: ${esc(shortVal(v[0]))} → ${esc(shortVal(v[1]))}` : `${esc(n)}: ${esc(shortVal(v))}`; }).join(' · ');
      const day = fmtDate(String(a.at).slice(0, 10)), head = day !== lastDay ? `<div class="actday">${esc(day)}</div>` : ''; lastDay = day;
      return head + `<div class="act"><b>${esc(a.staff_name || 'System')}</b> ${VERB[a.action] || esc(a.action)} ${TBL[a.tbl] || esc(a.tbl)}
        <span class="mono">${esc(a.label || '')}</span><div class="muted small">${esc(new Date(a.at).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }))}${sum ? ' · ' + sum : ''}</div></div>`; }).join('')
      : '<div class="empty">No activity.</div>';
  };
  $('#actF').oninput = draw; draw();
}

/* ---------------- installable app ---------------- */
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));

/* ---------------- boot ---------------- */
(async function init() {
  if (!window.supabase) return showFatal('Could not load the app. Check the internet connection.');
  const c = creds(); if (!c.url || !c.key) return showSetup();
  const sess = loadSession();
  if (sess && sess.token) {
    S.sb = makeClient(sess.token);
    const { data, error } = await S.sb.rpc('whoami');
    if (error && !isMissingFn(error)) return showFatal('Could not reach the server. Check the internet connection.');
    if (data && data.id) {
      S.me = { ...data, token: sess.token }; saveSession(S.me);
      if (S.me.must_change_pin) { lsDel('st_session'); return showLogin('Please sign in again to set your PIN.'); }
      return afterLogin();
    }
  }
  showLogin();
})();
</script>
