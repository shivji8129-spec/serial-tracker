<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#122133" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Serial Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600&display=swap">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Serial Tracker - Solartech Abuja
   Colours come from the company's own paperwork: the blue of the Odoo delivery slip and the sun-orange of the logo.
   Barlow (built on road / industrial signage) for the interface; its condensed cut sets refs and quantities like a docket. */
:root{
  --bg:#eef2f6;--card:#fff;--ink:#12233a;--muted:#5b6b80;--line:#d9e1ea;--brand:#1b64a8;--brand-ink:#fff;--sun:#f29a1f;
  --ok:#1d7a46;--ok-bg:#e3f4ea;--warn:#9a5500;--warn-bg:#fff1dc;--err:#b42318;--err-bg:#fde8e6;--info:#2f5d8a;--info-bg:#e6eef7;
  --active:#e8f0fa;--r:10px;
  --st-awaiting:#8496ad;--st-scanning:#f29a1f;--st-ready:#1d9a57;--st-delivered:#1b64a8;--st-missing:#d92d20;
  --f:'Barlow',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--fc:'Barlow Condensed','Barlow',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{
  --bg:#0b1522;--card:#122133;--ink:#e6edf5;--muted:#93a4b8;--line:#22364d;--brand:#5aa2e6;--brand-ink:#06182b;
  --ok:#5fd394;--ok-bg:#103223;--warn:#f5b041;--warn-bg:#33240b;--err:#ff7b6e;--err-bg:#3a1714;--info:#9cc3ea;--info-bg:#15283d;
  --active:#173252;--st-awaiting:#7f93ad;--st-scanning:#f5a623;--st-ready:#3fbf7f;--st-delivered:#5aa2e6;--st-missing:#ff6b5e}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{overflow-x:hidden;margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--f);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
a{color:var(--brand)}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-4px}

/* ---- top bar ---- */
.topwrap{position:sticky;top:0;z-index:5}
.top{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:var(--card);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brand .mark{width:32px;height:32px;border-radius:8px;background:var(--brand);display:grid;place-items:center;flex:none}
.brand b{display:block;font-size:17px;font-weight:700;line-height:1.1;letter-spacing:.1px}
.brand small{display:block;font-size:13px;color:var(--muted);line-height:1.2}
.who{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:none;border-radius:999px;padding:3px 12px 3px 3px;font-size:14px;font-weight:500;cursor:pointer;max-width:48vw}
.who .av{width:28px;height:28px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.who .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---- bottom navigation ---- */
.tabs{position:relative;z-index:6;display:flex;background:var(--card);border-bottom:1px solid var(--line)}
.tabs button{flex:1;display:flex;flex-direction:row;justify-content:center;align-items:center;gap:6px;padding:10px 2px 9px;border:0;background:none;color:var(--muted);font-size:12.5px;font-weight:500;cursor:pointer;position:relative}
.tabs button .i{width:19px;height:19px}
.tabs button.on{color:var(--brand);font-weight:600}
.tabs button.on::before{content:'';position:absolute;bottom:-1px;left:18%;right:18%;height:3px;border-radius:3px 3px 0 0;background:var(--brand)}
@media (max-width:400px){.tabs button{flex-direction:column;gap:2px;font-size:12px;padding:7px 2px 6px}}
main{max-width:760px;margin:0 auto;padding:18px 16px calc(32px + env(safe-area-inset-bottom))}

/* ---- type & layout ---- */
h2{font-size:23px;font-weight:700;margin:0;line-height:1.2;letter-spacing:-.1px}
h3{font-size:17px;font-weight:600;margin:0 0 6px}
.muted{color:var(--muted)}.small{font-size:14px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.pagehead{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.pagehead .sub{color:var(--muted);font-size:14px;margin-top:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
button.card{width:100%;text-align:left;cursor:pointer}
.mono,.ref{font-family:var(--fc);font-weight:600;letter-spacing:.3px;font-variant-numeric:tabular-nums}
.empty{padding:36px 12px;text-align:center;color:var(--muted)}

/* ---- buttons & fields ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:9px 14px;min-height:44px;font-weight:500;cursor:pointer;color:var(--ink);text-decoration:none}
.btn .i{width:18px;height:18px}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:600}
.btn.danger{color:var(--err);border-color:color-mix(in srgb,var(--err) 35%,var(--line))}
.btn.sm{min-height:36px;padding:6px 11px;font-size:14px}
.btn.ghost{border-color:transparent;background:none;padding-left:4px;padding-right:8px}
.btn:disabled{opacity:.5}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:9px 11px;min-height:44px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 18%,transparent)}
textarea{min-height:64px;resize:vertical}
input[type=checkbox]{width:20px;height:20px;min-height:0;vertical-align:middle;accent-color:var(--brand)}
label{display:block;font-size:14px;color:var(--muted);font-weight:500;margin-bottom:4px}
label.inline{display:inline-flex;gap:8px;align-items:center;color:var(--ink);margin:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}

/* ---- status ---- */
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600;background:var(--bg);color:var(--muted);white-space:nowrap}
.badge.st::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor}
.badge.ok{background:var(--ok-bg);color:var(--ok)}.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.bad{background:var(--err-bg);color:var(--err)}.badge.info{background:var(--info-bg);color:var(--info)}
.badge.done{background:var(--brand);color:var(--brand-ink)}
.note{border-radius:8px;padding:10px 12px;font-size:15px;display:flex;gap:8px;align-items:flex-start}
.note.warn{background:var(--warn-bg);color:var(--warn)}.note.err{background:var(--err-bg);color:var(--err)}.note.info{background:var(--info-bg);color:var(--info)}
.alert{display:flex;gap:9px;align-items:flex-start;border-radius:8px;padding:11px 12px;margin-bottom:12px;font-size:15px}
.alert .i{margin-top:1px}
.alert.warn{background:var(--warn-bg);color:var(--warn)}.alert.err{background:var(--err-bg);color:var(--err)}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--brand)}

/* ---- filter chips: one scrolling line ---- */
.chips{display:flex;gap:8px;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none;margin:0 -16px 14px;padding:0 16px 2px}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 13px;font-size:14.5px;font-weight:500;cursor:pointer}
.chips .cnt{font-family:var(--fc);font-weight:600;font-size:15.5px;color:var(--muted)}
.chips button.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.chips button.on .cnt{color:inherit;opacity:.75}
.chips button.hot:not(.on){border-color:var(--st-missing);color:var(--st-missing)}
.chips button.hot:not(.on) .cnt{color:var(--st-missing)}

/* ---- slip card: the status edge on the left is the one loud element ---- */
.slip{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.slip::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--rail,var(--line))}
.st-awaiting{--rail:var(--st-awaiting)}.st-scanning{--rail:var(--st-scanning)}.st-ready{--rail:var(--st-ready)}
.st-delivered{--rail:var(--st-delivered)}.st-missing{--rail:var(--st-missing)}
.slip-main{display:block;width:100%;text-align:left;border:0;background:none;padding:12px 14px 13px 19px;cursor:pointer}
.slip-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.slip .ref{font-size:20px;line-height:1.2}
.slip .cust{font-weight:600;font-size:16.5px;margin-top:3px;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:2px 14px;color:var(--muted);font-size:14px;margin-top:2px}
.prog{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:14px;color:var(--muted)}
.prog .bar{flex:1;margin:0}
.st-scanning .prog .bar i{background:var(--st-scanning)}.st-ready .prog .bar i{background:var(--st-ready)}
.st-missing .prog .bar i{background:var(--st-missing)}
.acts{display:flex;border-top:1px solid var(--line);margin-left:5px}
.acts button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;min-height:46px;border:0;background:none;font-weight:500;font-size:15px;cursor:pointer;color:var(--ink)}
.acts button .i{width:19px;height:19px;color:var(--muted)}
.acts button+button{border-left:1px solid var(--line)}
.acts button.pri{color:var(--brand);font-weight:600}.acts button.pri .i{color:var(--brand)}

/* ---- scanning lines & serials ---- */
.line{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--card);cursor:pointer}
.line.on{border-color:var(--brand);background:var(--active);box-shadow:0 0 0 1px var(--brand) inset}
.line.ns{cursor:default;color:var(--muted)}
.sn{display:inline-flex;align-items:center;gap:6px;font:600 15px/1.2 var(--fc);letter-spacing:.3px;font-variant-numeric:tabular-nums;
  border:1px solid var(--line);border-radius:6px;padding:4px 8px;margin:6px 6px 0 0;background:var(--card)}
.sn button{border:0;background:none;color:var(--err);font-size:18px;line-height:1;cursor:pointer;padding:0 2px 0 4px}
.sn small{font:500 11.5px var(--f);color:var(--muted);letter-spacing:0}
.sn.replaced{text-decoration:line-through;opacity:.5}.sn.ret{border-color:var(--warn)}
#reader-slip,#reader-search,#reader-dlg{width:100%;border-radius:var(--r);overflow:hidden;background:#000}
#reader-slip video,#reader-search video,#reader-dlg video{width:100%!important;display:block}

/* ---- stock ---- */
.stk{display:flex;gap:12px;align-items:center;padding:11px 14px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left;cursor:pointer}
.stk:last-child{border-bottom:0}
.stk .q{font:600 24px/1 var(--fc);min-width:56px;text-align:right;font-variant-numeric:tabular-nums}
.reg{width:100%;border-collapse:collapse;font-size:14px}
.reg th{font-weight:600;color:var(--muted);font-size:13px}
.reg th,.reg td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.reg .n{text-align:right;white-space:nowrap;font-family:var(--fc);font-weight:600;font-size:16px;font-variant-numeric:tabular-nums}
.reg th.n{font:600 13px var(--f)}
.reg tr.unc td{color:var(--muted)}.neg{color:var(--err)!important;font-weight:700}
.bignum{font:600 34px/1 var(--fc);font-variant-numeric:tabular-nums}

/* ---- misc ---- */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom));z-index:20;
  max-width:min(92vw,520px);padding:11px 16px;border-radius:10px;background:var(--ink);color:var(--card);font-weight:500;
  box-shadow:0 8px 28px #0003;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}.toast.ok{background:#1d7a46;color:#fff}.toast.warn{background:#9a5500;color:#fff}.toast.err{background:#b42318;color:#fff}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
dialog{border:0;border-radius:14px;padding:0;width:min(94vw,520px);background:var(--card);color:var(--ink);max-height:90vh}
dialog::backdrop{background:#0b1522a6}
.dlg{padding:18px}
table.lines{width:100%;border-collapse:collapse}
table.lines td{padding:4px 3px;vertical-align:middle}
table.lines td.q{width:76px}table.lines td.c{width:44px;text-align:center}table.lines td.x{width:44px}
.result{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:15px}
.result dt{color:var(--muted)}.result dd{margin:0}
.login{max-width:380px;margin:12px auto;text-align:center}
.login .logo{width:64px;height:64px;margin:6px auto 12px;border-radius:14px;background:var(--brand);display:grid;place-items:center}
.namebtn{display:flex!important;justify-content:space-between;align-items:center;gap:10px;font-size:17px}
.namebtn.last{border-color:var(--brand)}
.dots{display:flex;gap:12px;justify-content:center;margin:18px 0 14px}
.dots i{width:15px;height:15px;border-radius:50%;border:2px solid var(--brand)}
.dots i.on{background:var(--brand)}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:12px auto 0}
.pinpad button{height:64px;font:500 26px var(--f);border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;display:grid;place-items:center}
.pinpad button .i{width:26px;height:26px}
.pinpad button:active{background:var(--active)}
.pinpad .ok{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.subtabs{display:flex;gap:0;margin:0 0 14px;border:1px solid var(--line);border-radius:9px;padding:3px;background:var(--card);width:max-content;max-width:100%}
.subtabs button{border:0;background:none;border-radius:6px;padding:7px 14px;cursor:pointer;font-size:14.5px;font-weight:500;color:var(--muted)}
.subtabs button.on{background:var(--active);color:var(--brand);font-weight:600}
.tl{border-left:2px solid var(--line);margin:6px 0 0 6px;padding-left:16px}
.tl>div{position:relative;margin-bottom:12px}
.tl>div::before{content:'';position:absolute;left:-23px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--brand)}
.act{padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.subtabs.adm{width:100%}.subtabs.adm button{flex:1}
.staffrow{display:flex!important;align-items:center;gap:12px;color:var(--ink)}
.staffrow .av{width:38px;height:38px;border-radius:50%;background:var(--active);color:var(--brand);display:grid;place-items:center;font-weight:700;flex:none}
.staffrow>.i{color:var(--muted)}.staffrow.off{opacity:.6}
.roles{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:8px 0;font-size:14.5px}
.roles dt{font-weight:600}.roles dd{margin:0;color:var(--muted);min-width:0;overflow-wrap:anywhere}
@media (max-width:420px){.roles{grid-template-columns:1fr;gap:2px}.roles dd{margin-bottom:8px}}


/* ---- compact controls ---- */
.subtabs.adm button{white-space:nowrap;padding:7px 6px}
.rulerow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:none;cursor:pointer;color:var(--ink)}
.rulerow:last-child{border-bottom:0}.rulerow>.i{color:var(--muted)}.rulerow.off{opacity:.6}
.fold>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary .i{color:var(--muted);transition:transform .15s}.fold[open]>summary .i{transform:rotate(90deg)}
.actday{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;padding:12px 0 2px}
.act:last-child{border-bottom:0}
.iconbtn{padding:6px 9px}
.filterbar{display:flex;gap:8px;margin-bottom:8px}
.filterbar input{flex:1;min-width:0}
.daybtn{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:0 11px;min-height:44px;font-size:14.5px;font-weight:500;cursor:pointer;white-space:nowrap}
.daybtn .i{width:17px;height:17px;color:var(--muted)}
.sumtext{font-size:13.5px;color:var(--muted);margin:2px 2px 10px}.sumtext b{color:var(--ink);font-weight:600}
.dayopt{justify-content:flex-start!important;min-height:52px}.dayopt.on{border-color:var(--brand);background:var(--active);color:var(--brand)}
.upload{display:flex!important;align-items:center;gap:14px;margin:0 0 12px!important;padding:22px 16px;border:2px dashed color-mix(in srgb,var(--brand) 55%,var(--line));border-radius:var(--r);background:var(--card);color:var(--ink)!important;cursor:pointer;font-size:16px}
.upload.small{padding:11px 14px;border-width:1px;border-style:solid;border-color:var(--line)}
.upload .upicon{width:46px;height:46px;border-radius:12px;background:var(--active);color:var(--brand);display:grid;place-items:center;flex:none}
.upload.small .upicon{width:36px;height:36px;border-radius:9px}
.upload:active{background:var(--active)}
.btn.small{font-size:14.5px;color:var(--brand)}
@media (max-width:520px){
  .grid2.keep{grid-template-columns:1fr 1fr}
  h2{font-size:21px}
  .pagehead{margin-bottom:10px}
  .card{padding:12px}
  main{padding-top:14px}
  .acts button{min-height:42px;font-size:14.5px}
  .slip-main{padding:11px 12px 11px 17px}
  .slip .ref{font-size:18.5px}
  label{font-size:13.5px;margin-bottom:3px}
}
/* ---- grouped slip lists ---- */
.grp{margin-bottom:16px}
.grp>summary{list-style:none;display:flex;align-items:center;gap:9px;padding:4px 2px 10px;font-weight:600;font-size:17px;cursor:pointer}
.grp>summary::-webkit-details-marker{display:none}
.grp>summary .dot{width:10px;height:10px;border-radius:50%;background:var(--rail);flex:none}
.grp>summary .cnt{font:600 18px var(--fc);color:var(--muted)}
.grp>summary .i{margin-left:auto;color:var(--muted);transition:transform .15s}
.grp[open]>summary .i{transform:rotate(90deg)}
@media (prefers-reduced-motion:reduce){.grp>summary .i{transition:none}}
.sumline{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin-bottom:12px}
.datechip{position:relative;flex:none;display:inline-flex!important;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 13px;font-size:14.5px;font-weight:500;color:var(--ink)!important;margin:0!important;cursor:pointer}
.datechip .i{width:17px;height:17px}
.datechip.on{background:var(--ink);color:var(--card)!important;border-color:var(--ink)}
.datechip input{position:absolute;inset:0;opacity:0;width:100%;min-height:0;padding:0;border:0;cursor:pointer}
input[type=search]{-webkit-appearance:none;appearance:none}

/* ---- wide screens (office computers): navigation becomes a left sidebar ---- */
@media (min-width:900px){
  .tabs{position:fixed;left:0;top:var(--toph,55px);bottom:0;right:auto;border-bottom:0;width:224px;flex-direction:column;gap:2px;border-top:0;border-right:1px solid var(--line);padding:16px 12px}
  .tabs button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;padding:11px 12px;border-radius:8px;font-size:15.5px}
  .tabs button .i{width:21px;height:21px}
  .tabs button:hover{background:var(--bg);color:var(--ink)}
  .tabs button.on{background:var(--active);color:var(--brand)}

/* ======================================================================= */

/* ---------------- icons ---------------- */

};
const ic = n => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${IC[n] || ''}</svg>`;

const ROLE_LABEL = { admin: 'Admin', office: 'Office', warehouse: 'Warehouse', support: 'Sales / support' };
const PERMS = {
  scan: ['admin', 'office', 'warehouse'], editSlips: ['admin', 'office'], deleteSlip: ['admin'],
  serialActions: ['admin', 'office', 'support'], admin: ['admin'], export: ['admin', 'office']
};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lsGet = k => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const lsDel = k => { try { localStorage.removeItem(k); } catch (e) {} };
const fmtDate = d => d ? new Date(d + (String(d).length === 10 ? 'T00:00:00' : '')).toLocaleDateString('en-GB', {day:'2-digit', month:'short', year:'numeric'}) : '—';
const fmtDT = d => d ? new Date(d).toLocaleString('en-GB', {day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit'}) : '';
const qtyInt = q => Math.max(0, Math.round(Number(q) || 0));

const S = { sb: null, me: null, rules: [], view: 'scan', slip: null, activeLine: null, editing: null, scanner: null,
            lastCode: '', lastAt: 0, q: Promise.resolve(), audio: null, torch: false, dlgLocked: false, adminTab: 'staff' };
const can = p => !!(S.me && PERMS[p] && PERMS[p].includes(S.me.role));

/* ---------------- feedback ---------------- */
let toastT;
function toast(msg, kind = '', ms = 2600) {
  const t = $('#toast'); t.textContent = msg; t.className = 'toast show ' + kind;
  clearTimeout(toastT); toastT = setTimeout(() => t.className = 'toast', ms);
}
function buzz(kind) {
  try { navigator.vibrate && navigator.vibrate(kind === 'ok' ? 60 : [80, 60, 80]); } catch (e) {}
  try {
    if (!S.audio) return;
    const o = S.audio.createOscillator(), g = S.audio.createGain();
    o.frequency.value = kind === 'ok' ? 1250 : 300; g.gain.value = .12;
    o.connect(g); g.connect(S.audio.destination); o.start(); o.stop(S.audio.currentTime + (kind === 'ok' ? .09 : .3));
  } catch (e) {}
}
const errMsg = e => (e && (e.message || e.error_description || e.error)) || String(e);
const isDenied = e => e && (e.code === '42501' || /row-level security|permission denied/i.test(e.message || ''));
const isMissingFn = e => e && (e.code === 'PGRST202' || /Could not find the function|does not exist/i.test(e.message || ''));
function apiFail(e) {
  if (isDenied(e)) { toast('Not allowed for your role, or your session has ended', 'err', 4000); checkSession(); }
  else toast(errMsg(e), 'err', 5000);
}

/* ---------------- dialog ---------------- */
function openDlg(html, locked = false) {
  S.dlgLocked = locked; $('#dlgBody').innerHTML = html;
  const d = $('#dlg'); if (!d.open) d.showModal(); return d;
}
function closeDlg(force) { if (S.dlgLocked && !force) return; S.dlgLocked = false; const d = $('#dlg'); if (d.open) d.close(); }
$('#dlg').addEventListener('cancel', e => { if (S.dlgLocked) e.preventDefault(); });
$('#dlg').addEventListener('close', () => stopScanner());

/* ---------------- Supabase client & session ---------------- */
function creds() { return { url: CONFIG.SUPABASE_URL || lsGet('st_url'), key: CONFIG.SUPABASE_ANON_KEY || lsGet('st_key') }; }
function makeClient(token) {
  const c = creds();
  return supabase.createClient(c.url, c.key, {
    auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false },
    global: { headers: token ? { 'x-session': token } : {} } });
}
const loadSession = () => { try { return JSON.parse(lsGet('st_session') || 'null'); } catch (e) { return null; } };
const saveSession = s => lsSet('st_session', JSON.stringify(s));

function hideViews() { document.querySelectorAll('.view').forEach(v => v.hidden = true); }

function showSetup() {
  hideViews(); const v = $('#v-setup'); v.hidden = false;
  v.innerHTML = `<div class="card stack"><h2>Connect to Supabase</h2>
    <p class="muted small">Paste your project URL and publishable/anon key (Supabase → Connect).</p>
    <div><label>Project URL</label><input id="suUrl" placeholder="https://xxxx.supabase.co"></div>
    <div><label>Publishable / anon key</label><textarea id="suKey"></textarea></div>
    <button class="btn pri" id="suSave">Save and open</button></div>`;
  $('#suSave').onclick = () => {
    const u = $('#suUrl').value.trim().replace(/\/+$/, ''), k = $('#suKey').value.trim();
    if (!/^https:\/\/.+/.test(u) || k.length < 20) return toast('Check the URL and key', 'warn');
    lsSet('st_url', u); lsSet('st_key', k); location.reload();
  };
}
function showFatal(msg) {
  hideViews(); const v = $('#v-setup'); v.hidden = false;
  v.innerHTML = `<div class="card stack"><b>${esc(msg)}</b><button class="btn pri" onclick="location.reload()">Try again</button></div>`;
}

/* ================================ SIGN-IN ================================ */
async function showLogin(msg) {
  await stopScanner(); stopTimers(); closeDlg(true);
  S.me = null; S.sb = makeClient(null);
  $('#tabs').hidden = true; $('#userChip').hidden = true;
  hideViews(); const v = $('#v-login'); v.hidden = false;
  v.innerHTML = `<div class="login">
    <div class="logo"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M4 5v14M7 5v14M11 5v14M14 5v14M18 5v14M20 5v14"/></svg></div>
    <h2>Sign in</h2><p class="muted small">Tap your name, then enter your PIN.</p>
    ${msg ? `<div class="note warn" style="margin:10px 0">${esc(msg)}</div>` : ''}
    <div id="staffList" class="stack" style="margin-top:12px"><div class="empty">Loading…</div></div></div>`;
  const { data, error } = await S.sb.rpc('list_login_staff');
  const box = $('#staffList'); if (!box) return;
  if (error) {
    box.innerHTML = isMissingFn(error)
      ? `<div class="card">The database needs the v2 upgrade. Run <b>upgrade_v2.sql</b> in Supabase → SQL Editor, then reload this page.</div>`
      : `<div class="card stack"><div class="alert err" style="margin:0">${ic('warn')}<span>${esc(error.message)}</span></div><button class="btn" onclick="showLogin()">Try again</button></div>`;
    return;
  }
  if (!data.length) { box.innerHTML = '<div class="empty">No active staff. Ask the admin.</div>'; return; }
  const last = lsGet('st_last_staff');
  S.staffList = data.slice().sort((a, b) => (b.id === last) - (a.id === last));
  box.innerHTML = S.staffList.map(s => `<button class="card namebtn ${s.id === last ? 'last' : ''}" onclick="pinPad('${s.id}')">
      <b>${esc(s.name)}</b><span class="muted small">${esc(ROLE_LABEL[s.role] || s.role)}</span></button>`).join('');
}

function pinPad(id) {
  const s = S.staffList.find(x => x.id === id); if (!s) return;
  let pin = '', busy = false;
  const v = $('#v-login');
  v.innerHTML = `<div class="login">
    <div style="text-align:left"><button class="btn sm ghost" id="ppBack">${ic('back')}Back</button></div>
    <h2 style="margin-top:14px">${esc(s.name)}</h2><p class="muted small">Enter your PIN</p>
    <div class="dots" id="dots"></div>
    <div class="note err" id="pinErr" hidden></div>
    <div class="pinpad">${[1,2,3,4,5,6,7,8,9].map(n => `<button data-k="${n}">${n}</button>`).join('')}
      <button data-k="del" aria-label="Delete">${ic('del')}</button><button data-k="0">0</button><button data-k="ok" class="ok" aria-label="Sign in">${ic('check')}</button></div></div>`;
  const draw = () => { $('#dots').innerHTML = Array.from({ length: Math.max(4, pin.length) }, (_, i) => `<i class="${i < pin.length ? 'on' : ''}"></i>`).join(''); };
  const submit = async () => {
    if (busy || pin.length < 4) return;
    busy = true;
    const { data, error } = await S.sb.rpc('login', { p_staff: id, p_pin: pin });
    busy = false;
    if (error || !data || !data.ok) {
      const e = $('#pinErr'); pin = ''; draw(); buzz('err');
      e.hidden = false; e.textContent = error ? errMsg(error) : data.error; return;
    }
    const entered = pin; pin = '';
    lsSet('st_last_staff', id); document.onkeydown = null;
    S.me = { id: data.id, name: data.name, role: data.role, branch: data.branch, must_change_pin: data.must_change_pin, token: data.token };
    saveSession(S.me); S.sb = makeClient(data.token);
    if (data.must_change_pin) return changePin(true, entered);
    afterLogin();
  };
  const press = k => { if (k === 'ok') return submit(); if (k === 'del') pin = pin.slice(0, -1); else if (pin.length < 6) pin += k; draw(); if (pin.length === 6) submit(); };
  v.querySelectorAll('.pinpad button').forEach(b => b.onclick = () => press(b.dataset.k));
  $('#ppBack').onclick = () => { document.onkeydown = null; showLogin(); };
  document.onkeydown = e => { if ($('#v-login').hidden) return;
    if (/^\d$/.test(e.key)) press(e.key); else if (e.key === 'Backspace') press('del'); else if (e.key === 'Enter') press('ok'); };
  draw();
}

function changePin(forced, current) {
  openDlg(`<div class="stack">
    <h3>${forced ? 'Set your own PIN' : 'Change PIN'}</h3>
    ${forced ? '<p class="muted small" style="margin:0">You signed in with a starting PIN. Choose a new 4–6 digit PIN that only you know.</p>'
             : '<div><label>Current PIN</label><input id="cpOld" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password"></div>'}
    <div><label>New PIN</label><input id="cpNew" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password"></div>
    <div><label>Repeat new PIN</label><input id="cpNew2" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password"></div>
    <div class="row" style="justify-content:flex-end">
      ${forced ? '<button class="btn" id="cpOut">Sign out</button>' : '<button class="btn" onclick="closeDlg()">Cancel</button>'}
      <button class="btn pri" id="cpOk">Save PIN</button></div></div>`, forced);
  if (forced) $('#cpOut').onclick = () => logout();
  setTimeout(() => (forced ? $('#cpNew') : $('#cpOld')).focus(), 60);
  $('#cpOk').onclick = async () => {
    const old = forced ? current : $('#cpOld').value, n = $('#cpNew').value, n2 = $('#cpNew2').value;
    if (!/^\d{4,6}$/.test(n)) return toast('PIN must be 4 to 6 digits', 'warn');
    if (n !== n2) return toast("The two new PINs don't match", 'warn');
    const { data, error } = await S.sb.rpc('change_my_pin', { p_old: old, p_new: n });
    if (error || !data || !data.ok) return toast(error ? errMsg(error) : data.error, 'err', 4000);
    S.me.must_change_pin = false; saveSession(S.me); closeDlg(true); toast('PIN saved', 'ok');
    if (forced) afterLogin();
  };
}

async function logout() {
  try { await S.sb.rpc('logout'); } catch (e) {}
  lsDel('st_session'); showLogin();
}

function userMenu() {
  openDlg(`<div class="stack">
    <div><h3 style="margin:0">${esc(S.me.name)}</h3>
      <div class="muted small">${esc(ROLE_LABEL[S.me.role] || S.me.role)}${S.me.branch ? ' · ' + esc(S.me.branch) : ''}</div></div>
    <button class="btn" id="umPin">${ic('key')}Change my PIN</button>
    <button class="btn danger" id="umOut">${ic('logout')}Sign out</button>
    <button class="btn" onclick="closeDlg()">Close</button></div>`);
  $('#umPin').onclick = () => { closeDlg(); changePin(false); };
  $('#umOut').onclick = () => { closeDlg(); logout(); };
}

const TABS = [['scan', 'scan', 'Scan', 'scan'], ['slips', 'slips', 'Slips', 'editSlips'], ['stock', 'stock', 'Stock', null], ['search', 'search', 'Search', null], ['admin', 'admin', 'Admin', 'admin']];
function buildTabs() {
  const t = $('#tabs');
  t.innerHTML = TABS.filter(x => !x[3] || can(x[3])).map(([v, i, l]) => `<button data-view="${v}">${ic(i)}<span>${l}</span></button>`).join('');
  t.querySelectorAll('button').forEach(b => b.onclick = () => go(b.dataset.view));
  const setTop = () => document.documentElement.style.setProperty('--toph', $('.top').offsetHeight + 'px');
  setTop(); window.addEventListener('resize', setTop);
  t.hidden = false;
}
function renderUser() {
  const c = $('#userChip'); c.hidden = false;
  const ini = S.me.name.split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join('');
  c.innerHTML = `<span class="av">${esc(ini)}</span><span class="nm">${esc(S.me.name)}</span>`; c.title = ROLE_LABEL[S.me.role] || S.me.role; c.onclick = userMenu;
}
async function afterLogin() {
  document.onkeydown = null; closeDlg(true);
  buildTabs(); renderUser(); startTimers();
  await loadRules();
  go(can('scan') ? 'scan' : 'search');
}

/* ---------------- timers: keep screens fresh, catch ended sessions ---------------- */
function startTimers() {
  stopTimers();
  S.pollT = setInterval(() => { if (document.visibilityState === 'visible') quietRefresh(); }, 15000);
  S.sessT = setInterval(checkSession, 5 * 60 * 1000);
}
function stopTimers() { clearInterval(S.pollT); clearInterval(S.sessT); }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.me) { checkSession(); quietRefresh(); } });
async function checkSession() {
  if (!S.me) return;
  const { data, error } = await S.sb.rpc('whoami');
  if (error) return;                               // offline: keep going, try again later
  if (!data) { lsDel('st_session'); return showLogin('Your session ended. Please sign in again.'); }
  if (data.role !== S.me.role) { Object.assign(S.me, data); saveSession(S.me); buildTabs(); renderUser(); go(can('scan') ? 'scan' : 'search'); }
}
const slipSig = s => s.status + (s.delivered_at || '') + '|' + s.serials.map(x => x.id + x.status).join(',') + '|' + s.slip_lines.map(l => l.id + l.qty + l.needs_serial).join(',');
async function quietRefresh() {
  if (!S.me) return;
  if (S.view === 'scan') loadOpenSlips();
  else if (S.view === 'slips') loadSlipList();
  else if (S.view === 'scanSlip' && S.slip) {
    const before = slipSig(S.slip);
    try { await loadSlip(S.slip.id); if (slipSig(S.slip) !== before) renderLines(); } catch (e) {}
  }
}

/* ---------------- product rules ---------------- */
async function loadRules() {
  const { data, error } = await S.sb.from('product_rules').select('*').order('sort').order('label');
  if (!error) S.rules = data || [];
}
const kwRx = k => new RegExp('(^|[^A-Za-z0-9_])' + k.trim().replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i');
function ruleFor(product) {
  const p = String(product || '');
  for (const r of S.rules) {
    if (!r.active) continue;
    if (String(r.keywords || '').split(',').some(k => k.trim() && kwRx(k).test(p))) return r;
  }
  return null;
}
const needsSerial = p => S.rules.length ? !!(ruleFor(p) && ruleFor(p).needs_serial) : CONFIG.SERIAL_PRODUCTS.test(p);
function patternOk(rule, serial) {
  if (!rule || !rule.serial_pattern) return true;
  try { return new RegExp(rule.serial_pattern, 'i').test(serial); } catch (e) { return true; }
}

/* ---------------- slip data ---------------- */
const counts = s => s.status !== 'replaced';
function progressOf(s) {
  const need = (s.slip_lines || []).filter(l => l.needs_serial).reduce((a, l) => a + qtyInt(l.qty), 0);
  const got = (s.serials || []).filter(counts).length;
  return { need, got, pct: need ? Math.min(100, Math.round(got / need * 100)) : 0 };
}
async function loadSlip(id) {
  const { data, error } = await S.sb.from('slips').select('*, slip_lines(*), serials(*)').eq('id', id).single();
  if (error) throw error;
  data.slip_lines.sort((a, b) => a.line_no - b.line_no);
  data.serials.sort((a, b) => a.scanned_at.localeCompare(b.scanned_at));
  S.slip = data;
  if (!S.activeLine || !data.slip_lines.some(l => l.id === S.activeLine && l.needs_serial)) S.activeLine = nextIncompleteLine();
  return data;
}
const lineAll = l => S.slip.serials.filter(s => s.line_id === l.id);
const lineSerials = l => lineAll(l).filter(counts);
function nextIncompleteLine() {
  const l = S.slip.slip_lines.find(l => l.needs_serial && lineSerials(l).length < qtyInt(l.qty));
  return l ? l.id : null;
}

/* ---------------- serial extraction ---------------- */
function extractSerial(raw) {
  let t = String(raw || '').trim();
  const m = t.match(/(?:\bS\/?N|SERIAL(?:\s*(?:NO|NUMBER))?)\s*[:#=.\-]?\s*([A-Z0-9][A-Z0-9\-\/]{3,})/i);
  if (m) return m[1].toUpperCase();
  try { const u = new URL(t); for (const k of ['sn', 'SN', 'serial', 'Serial', 'serialNo', 'sno']) { const v = u.searchParams.get(k); if (v) return v.trim().toUpperCase(); } } catch (e) {}
  if (/[\r\n;|,]/.test(t)) { const parts = t.split(/[\r\n;|,]+/).map(s => s.trim()).filter(Boolean);
    t = parts.slice().sort((a, b) => b.length - a.length)[0] || t; }
  return t.replace(/\s+/g, '').toUpperCase();
}

/* ---------------- camera ---------------- */
async function startScanner(elId, onCode) {
  await stopScanner();
  if (!window.Html5Qrcode) throw new Error('Scanner library did not load. Check the internet connection.');
  try { S.audio = S.audio || new (window.AudioContext || window.webkitAudioContext)(); S.audio.resume && S.audio.resume(); } catch (e) {}
  const F = window.Html5QrcodeSupportedFormats;
  const formats = F ? [F.QR_CODE, F.CODE_128, F.CODE_39, F.CODE_93, F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.ITF, F.CODABAR, F.DATA_MATRIX] : undefined;
  const qr = new Html5Qrcode(elId, { formatsToSupport: formats, verbose: false, experimentalFeatures: { useBarCodeDetectorIfSupported: true } });
  S.scanner = qr; S.torch = false;
  await qr.start({ facingMode: 'environment' },
    { fps: 12, qrbox: (w, h) => ({ width: Math.max(120, Math.floor(Math.min(w * .92, 440))), height: Math.max(80, Math.floor(Math.min(h * .55, 210))) }) },
    txt => onCode(txt), () => {});
}
async function stopScanner() {
  const q = S.scanner; S.scanner = null;
  if (q) { try { if (q.isScanning) await q.stop(); q.clear(); } catch (e) {} }
}
async function toggleTorch() {
  if (!S.scanner) return;
  try { S.torch = !S.torch; await S.scanner.applyVideoConstraints({ advanced: [{ torch: S.torch }] }); }
  catch (e) { S.torch = false; toast('Torch not supported on this phone', 'warn'); }
}

function snChip(x) {

function queueSerial(raw, source) { S.q = S.q.then(() => addSerial(raw, source)).catch(e => { buzz('err'); apiFail(e); }); }

async function addSerial(raw, source) {
  if (!S.slip) return;
  const serial = extractSerial(raw), now = Date.now();
  if (serial === S.lastCode && now - S.lastAt < 3000) return;       // same code still under the camera
  S.lastCode = serial; S.lastAt = now;
  if (serial.length < 4) { buzz('err'); return toast('Code too short: ' + raw, 'warn'); }
  if (S.slip.serials.some(x => x.serial === serial && x.status === 'active')) { buzz('err'); return toast(serial + ' is already on this slip', 'warn'); }
  let line = S.slip.slip_lines.find(l => l.id === S.activeLine);
  if (!line || !line.needs_serial || lineSerials(line).length >= qtyInt(line.qty)) {
    S.activeLine = nextIncompleteLine(); line = S.slip.slip_lines.find(l => l.id === S.activeLine);
  }
  if (!line) { buzz('err'); return toast('All serial lines on this slip are already complete', 'warn'); }
  const rule = ruleFor(line.product);
  if (!patternOk(rule, serial)) {
    buzz('err');
    if (source === 'camera') return toast(`${serial} isn't a valid ${rule.label} serial. Scan the S/N barcode.`, 'err', 4500);
    if (!confirm(`${serial} doesn't match the usual ${rule.label} serial format. Save it anyway?`)) return;
  }
  const before = progressOf(S.slip);
  const { data, error } = await S.sb.from('serials').insert({
    serial, raw_code: raw.trim() !== serial ? raw.trim() : null, slip_id: S.slip.id, line_id: line.id, product: line.product
  }).select().single();
  if (error) {
    buzz('err');
    if (error.code === '23505') {
      const { data: ex } = await S.sb.from('serial_lookup').select('slip_ref,customer_name').eq('serial', serial).eq('status', 'active').maybeSingle();
      return toast(`${serial} is already recorded on ${ex ? ex.slip_ref + ' (' + ex.customer_name + ')' : 'another slip'}`, 'err', 6000);
    }
    return apiFail(error);
  }
  S.slip.serials.push(data); buzz('ok');
  toast('Added ' + serial + ' to ' + line.product.slice(0, 40), 'ok');
  if (lineSerials(line).length >= qtyInt(line.qty)) S.activeLine = nextIncompleteLine() || line.id;
  const after = progressOf(S.slip);
  if (after.need && after.got >= after.need && before.got < before.need) setTimeout(() => toast('All serials captured for this slip', 'ok', 3500), 1200);
  renderLines();
}

async function delSerial(id) {
  const x = S.slip.serials.find(s => s.id === id); if (!x) return;
  if (!confirm('Remove serial ' + x.serial + ' from this slip?')) return;
  const { data, error } = await S.sb.from('serials').delete().eq('id', id).select('id');
  if (error) return apiFail(error);
  if (!data.length) return toast('Not allowed. Warehouse can only remove their own scans within 2 hours. Ask the office.', 'warn', 5000);
  S.slip.serials = S.slip.serials.filter(s => s.id !== id);
  if (x.line_id) S.activeLine = x.line_id;
  S.lastCode = ''; renderLines();
}

/* ---------- Odoo PDF import ---------- */
async function importPdf(file) {
  const msg = $('#pdfMsg');
  if (!window.pdfjsLib) return toast('PDF reader did not load. Check the internet connection.', 'err');
  msg.textContent = 'Reading PDF…';
  try {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const buf = new Uint8Array(await file.arrayBuffer());
    const pdf = await pdfjsLib.getDocument({ data: buf.slice() }).promise;
    const lines = []; let pageW = 595; const p1items = [];
    for (let p = 1; p <= pdf.numPages; p++) {
      const page = await pdf.getPage(p); pageW = page.getViewport({ scale: 1 }).width;
      const tc = await page.getTextContent(); const rows = [];
      for (const it of tc.items) {
        if (!it.str || !it.str.trim()) continue;
        const x = it.transform[4], y = it.transform[5];
        let r = rows.find(r => Math.abs(r.y - y) < 3); if (!r) { r = { y, items: [] }; rows.push(r); }
        r.items.push({ x, y, s: it.str, w: it.width || 0 });
        if (p === 1) p1items.push({ x, y, s: it.str, w: it.width || 0 });
      }
      rows.sort((a, b) => b.y - a.y);
      for (const r of rows) { r.items.sort((a, b) => a.x - b.x);
        lines.push({ page: p, x: r.items[0].x, y: r.y, text: joinRun(r.items), items: r.items }); }
    }
    const got = interpretSlip(lines, pageW, p1items);
    if (!got.slip_ref) got.slip_ref = refFromName(file.name);
    if (isOwnAddr(got.customer_name)) { got.customer_name = ''; got.customer_address = ''; }
    collectForm();
    const e = S.editing;
    if (e.id && got.slip_ref && refOk(e.slip_ref) && got.slip_ref !== e.slip_ref.trim().toUpperCase()
        && !confirm(`This PDF is ${got.slip_ref}, but you are editing ${e.slip_ref}. Attach it anyway?`)) { msg.textContent = 'PDF not attached.'; return; }
    e.pdf = { name: file.name, b64: bytesToB64(buf) };
    for (const k of ['slip_ref', 'so_ref', 'slip_date', 'customer_name', 'customer_phone', 'customer_address']) if (got[k]) e[k] = got[k];
    if (got.lines.length && !e.id) e.lines = got.lines;
    else if (got.lines.length && e.id) toast('Products not replaced on an existing slip. Edit lines by hand.', 'warn', 4000);
    renderEditor();
    $('#pdfMsg').innerHTML = `Read <b>${got.lines.length}</b> product line(s)${got.slip_ref ? ' from ' + esc(got.slip_ref) : ''}. Please check every field before saving.`
      + '<br>The original PDF will be kept with the slip, so it can be printed with the serial numbers on it.';
  } catch (err) { msg.textContent = 'Could not read this PDF: ' + errMsg(err); }
}

// Join text runs on one row; only add a space where there is a visible gap (stops "WH / OUT / 001" splits)
function joinRun(items) {
  let out = '', prevEnd = null;
  for (const i of items) {
    if (prevEnd !== null && i.x - prevEnd > 1.2 && !/\s$/.test(out) && !/^\s/.test(i.s)) out += ' ';
    out += i.s; prevEnd = i.x + (i.w || 0);
  }
  return out.replace(/\s+/g, ' ').trim();
}

// Choose which line of the customer block is the customer's name rather than part of the address
const ADDR_WORDS = /\b(street|str|st|road|rd|avenue|ave|close|crescent|cres|way|estate|lane|drive|plot|block|blk|district|phase|layout|junction|house|floor|suite|off|opp|opposite|behind|beside|along|by|area|zone|quarters|gra|lga|state|fct|nigeria|abuja|lagos|ikeja|lekki|ikorodu|victoria island|port harcourt|portharcourt|kano|kaduna|ibadan|enugu|uyo|benin|warri|owerri|jos|utako|wuse|garki|maitama|asokoro|gwarinpa|jabi|kubwa|lugbe|apo|life camp|po box|p\.o\.)\b/i;
const NAME_WORDS = /^(mr|mrs|ms|miss|dr|engr|eng|chief|alhaji|alhaja|hajia|hon|barr|prof|pastor|rev|sir|lady|madam|mallam)\b\.?|\b(ltd|limited|plc|enterprises?|ventures|nig|company|co\.|services|global|group|international|intl|solutions|industries|hotels?|school|church|ministry|hospital|clinic|bank|agency|stores?)\b/i;
// Remove our own warehouse address lines and the pure city/state/country lines that follow them
function dropOwnAddress(block) {
  const norm = s => s.toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
  const own = (CONFIG.OWN_ADDRESSES || []).map(norm).filter(Boolean);
  const out = []; let skipping = false;
  for (const t of block) {
    if (own.some(o => norm(t).includes(o))) { skipping = true; continue; }
    if (skipping && ADDR_WORDS.test(t) && !NAME_WORDS.test(t) && !/\d/.test(t)) continue;   // e.g. "Abuja FCT Nigeria"
    skipping = false; out.push(t);
  }
  return out;
}
function pickNameLine(block) {
  const score = t => (NAME_WORDS.test(t) ? 3 : 0) - (ADDR_WORDS.test(t) ? 2 : 0) - (/^\d/.test(t) ? 3 : 0) - (/\d{3,}/.test(t) ? 1 : 0);
  let best = 0;
  block.forEach((t, i) => { if (score(t) > score(block[best])) best = i; });
  return best;
}

function interpretSlip(lines, pageW, p1items) {
  const all = lines.map(l => l.text).join('\n');
  const r = { slip_ref: '', so_ref: '', slip_date: '', customer_name: '', customer_phone: '', customer_address: '', lines: [] };
  const refs = (all.match(/\b[A-Z0-9]{1,8}\s*\/\s*(?:OUT|IN|PICK|PACK|INT)\s*\/\s*\d{2,}\b/gi) || []).map(x => x.replace(/\s+/g, '').toUpperCase());
  r.slip_ref = refs.find(x => /\/OUT\//.test(x)) || refs[0] || '';
  const so = all.match(/\bOrder\b[^\n]*?\b(S\d{3,}|SO\d{3,})\b/i) || all.match(/\b(S\d{4,})\b/); if (so) r.so_ref = so[1];
  const d = all.match(/\b(\d{1,2})\/(\d{1,2})\/(\d{4})\b/), di = all.match(/\b(\d{4})-(\d{2})-(\d{2})\b/);
  if (di) r.slip_date = di[0];
  else if (d) { const a = +d[1], b = +d[2]; const [mm, dd] = a > 12 ? [b, a] : [a, b];   // Odoo en_US prints MM/DD/YYYY
    r.slip_date = `${d[3]}-${String(mm).padStart(2, '0')}-${String(dd).padStart(2, '0')}`; }
  // First phone number on the slip that isn't one of ours (compare on the last 10 digits, so 0902… and +234902… match)
  const last10 = p => p.replace(/\D/g, '').slice(-10);
  const ownPh = (CONFIG.OWN_PHONES || []).map(last10);
  const phones = all.match(/(?:\+?234|\b0)[\s-]?[789][01]\d[\s-]?\d{3}[\s-]?\d{4}\b/g) || [];
  const custPh = phones.find(p => !ownPh.includes(last10(p)));
  if (custPh) r.customer_phone = custPh.replace(/[\s-]/g, '');

  // Customer block: right-half text on page 1, above the slip-ref heading, regrouped into its own lines
  const p1 = lines.filter(l => l.page === 1);
  const refRx = /[A-Z0-9]{1,8}\s*\/\s*(?:OUT|IN|PICK|PACK|INT)\s*\/\s*\d{2,}/i;
  const head = p1.find(l => refRx.test(l.text));
  const headY = head ? head.y : (p1[Math.min(p1.length - 1, 14)] || { y: -1 }).y;
  const right = (p1items || []).filter(i => i.x > pageW * .45 && i.y > headY + 2 && i.s.trim());
  const rrows = [];
  for (const it of right) { let rr = rrows.find(x => Math.abs(x.y - it.y) < 3); if (!rr) { rr = { y: it.y, items: [] }; rrows.push(rr); } rr.items.push(it); }
  rrows.sort((a, b) => b.y - a.y);
  const company = /solar\s*tech|solartech|renewable solutions|www\.|@|tax id|vat|rc\s*no|page \d/i;
  const isPhone = t => /^(?:tel|phone|mobile)?\s*:?\s*(?:\+?234|0)[\s-]?[789][01]\d/i.test(t.replace(/\s/g, ''));
  const cust = rrows.map(rr => joinRun(rr.items.sort((a, b) => a.x - b.x)))
    .map(t => t.replace(/^(customer( address)?|delivery address|shipping address|ship to|partner)\s*:?\s*/i, '').trim())
    .filter(t => t.length > 1 && !company.test(t) && !refRx.test(t));
  const block = dropOwnAddress(cust.filter(t => !isPhone(t)).map(t => t.replace(/[,\s]+$/, '')));
  if (block.length) {
    // The name is not always the first line (some slips print street, city, then the person), so pick the line that looks like a name
    const idx = pickNameLine(block);
    r.customer_name = block[idx];
    r.customer_address = block.filter((_, i) => i !== idx).join(', ').replace(/,\s*,/g, ',');
  }

  // Product table
  const hdr = lines.findIndex(l => /product/i.test(l.text) && /(quantity|qty|delivered|ordered|done)/i.test(l.text));
  if (hdr >= 0) {
    const stop = /signature|^total|terms|thank|^notes?\b|received by|customer sign|remaining quantit|not yet delivered|back ?orders?\b/i;
    const qtyRx = /^(.*?)\s+(\d+(?:[.,]\d+)?)\s*(?:units?|unit\(s\)|pcs?|nos?|pieces?|set|sets)?(?:\s+(\d+(?:[.,]\d+)?)\s*(?:units?|unit\(s\)|pcs?|nos?|pieces?|set|sets)?)?$/i;
    // Page header/footer text (company contacts, page numbers) must never become a product or part of one
    const normA = s => s.toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
    const ownAddr = (CONFIG.OWN_ADDRESSES || []).map(normA).filter(Boolean);
    const ownPh10 = (CONFIG.OWN_PHONES || []).map(p => p.replace(/\D/g, '').slice(-10));
    const isFooter = t => /@|www\.|https?:\/\/|\b(mobile|phone|tel|email|e-mail|website|rc\s*no|tin)\b\s*:?|page\s*\d+\s*(\/|of)\s*\d+/i.test(t)
      || ownAddr.some(a => normA(t).includes(a)) || ownPh10.some(p => t.replace(/\D/g, '').includes(p))
      || /solar\s*tech\s*renewable/i.test(t);
    let prev = null;                                                              // the row the last product came from
    for (let i = hdr + 1; i < lines.length; i++) {
      const L = lines[i], t = L.text;
      if (isFooter(t)) { prev = null; continue; }                                 // footer / page number: skip, table may continue
      if (stop.test(t)) break;
      if (/product/i.test(t) && /(quantity|qty|delivered|ordered)/i.test(t)) { prev = null; continue; }   // repeated header on next page
      const m = t.match(qtyRx);
      if (m && m[1].trim().length > 1) {
        const q1 = parseFloat(m[2].replace(',', '.')), q2 = m[3] ? parseFloat(m[3].replace(',', '.')) : null;
        const product = m[1].trim();
        r.lines.push({ id: null, product, qty: q2 !== null ? (q2 > 0 ? q2 : q1) : q1, needs_serial: needsSerial(product) });
        prev = L;
      } else if (prev && L.page === prev.page && prev.y - L.y < 26 && t.length > 2 && !/^[\d.,\s]+$/.test(t)) {
        const last = r.lines[r.lines.length - 1];                                  // wrapped product name, directly below
        last.product += ' ' + t; last.needs_serial = needsSerial(last.product); prev = L;
      } else prev = null;
    }
  }
  r.lines.forEach(l => { l.product = dedupeName(l.product); l.needs_serial = needsSerial(l.product); });
  return r;
}
// "[Consumables] Aluminium clamp [Consumables] Aluminium clamp" -> "[Consumables] Aluminium clamp"
function dedupeName(t) {
  t = String(t || '').replace(/\s+/g, ' ').trim();
  const w = t.split(' ');
  if (w.length % 2 === 0) { const h = w.length / 2, a = w.slice(0, h).join(' '); if (a.toLowerCase() === w.slice(h).join(' ').toLowerCase()) return a; }
  const m = /^(\[[^\]]+\]\s*)?(.+?)\s+\[[^\]]+\]\s*(.+)$/.exec(t);          // "[CODE] Name [CODE] Name, longer description"
  if (m && m[3].toLowerCase().startsWith(m[2].toLowerCase())) return (m[1] || '') + m[3];
  return t;
}

/* ---------- Print slip with serials ---------- */
// The original Odoo PDF is stored with the slip (table slip_files). Printing writes the scanned serial numbers
// onto that same PDF as plain text, in the first empty space below the product table that is big enough.
// If nothing on page 1 is big enough, page 1 gets a short note and the serials go on an extra page.

function bytesToB64(u8) {
  let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  return btoa(s);
}
function b64ToBytes(b64) { const s = atob(b64), u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; }
const missingTable = e => /slip_files|42P01|PGRST205|schema cache/i.test((e && (e.code + ' ' + e.message)) || '');
async function slipHasPdf(id) {
  const { data, error } = await S.sb.from('slip_files').select('slip_id').eq('slip_id', id).maybeSingle();
  return !error && !!data;
}
// Standard PDF fonts only know Latin-1; swap or drop anything else so drawing never fails
const pdfSafe = t => String(t ?? '').replace(/[‐-―]/g, '-').replace(/[‘’]/g, "'").replace(/[“”]/g, '"')
  .replace(/…/g, '...').replace(/[^\x20-\x7E\xA0-\xFF]/g, '');
const normP = s => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '');

async function printSlip(id) {
  try {
    const s = await loadSlip(id);
    const { data: f, error: fe } = await S.sb.from('slip_files').select('file_name,pdf_base64').eq('slip_id', id).maybeSingle();
    if (fe && !missingTable(fe)) throw fe;
    if (!f) return printBasic(s);
    if (!window.PDFLib || !window.pdfjsLib) return toast('PDF tools did not load. Check the internet connection.', 'err');
    toast('Preparing slip…', '', 1500);
    const out = await buildSlipPdf(s, b64ToBytes(f.pdf_base64));
    showSlipActions(s, out);
  } catch (e) { apiFail(e); }
}

// Groups of serials per product line, in slip order
function serialGroups(s) {
  const g = s.slip_lines.filter(l => l.needs_serial).map(l => ({ product: l.product, qty: qtyInt(l.qty), sns: lineSerials(l).map(x => x.serial) }));
  const loose = s.serials.filter(x => counts(x) && !s.slip_lines.some(l => l.id === x.line_id)).map(x => x.serial);
  if (loose.length) g.push({ product: 'Other scanned serials', qty: loose.length, sns: loose });
  return g;
}

// Turn the groups into rows of text (title, product heading, serials in columns) that can be flowed onto pages
function serialRows(groups, font, bold, width) {
  const FS = 8, rows = [];
  rows.push({ h: 13, title: true, draw: (pg, x, y) => pg.drawText('Serial numbers', { x, y: y - 9, size: 9.5, font: bold }) });
  const all = groups.flatMap(g => g.sns);
  const colW = Math.max(56, ...all.map(t => font.widthOfTextAtSize(pdfSafe(t), FS))) + 12;
  const cols = Math.max(1, Math.floor(width / colW));
  groups.forEach((g, gi) => {
    const short = g.sns.length < g.qty ? `  (${g.sns.length} of ${g.qty} scanned)` : `  (${g.sns.length})`;
    let head = pdfSafe(g.product);
    while (head.length > 8 && bold.widthOfTextAtSize(head + short, FS) > width) head = head.slice(0, -2);
    if (head !== pdfSafe(g.product)) head = head.replace(/\s+\S*$/, '') + '...';
    const headTxt = head + short;
    rows.push({ h: 11, head: headTxt, draw: (pg, x, y) => pg.drawText(headTxt, { x, y: y - 8.5, size: FS, font: bold }) });
    for (let i = 0; i < g.sns.length; i += cols) {
      const chunk = g.sns.slice(i, i + cols).map(pdfSafe);
      rows.push({ h: 10, group: gi, headTxt, draw: (pg, x, y) => chunk.forEach((t, c) => pg.drawText(t, { x: x + c * colW, y: y - 8.5, size: FS, font })) });
    }
    if (gi < groups.length - 1) rows.push({ h: 3, draw: () => {} });
  });
  return rows;
}

const rowsHeight = rows => rows.reduce((a, r) => a + r.h, 0);

// Empty horizontal bands on page 1 below the product table (rendered, so images and lines count as content)
async function freeBands(pdfBytes, s) {
  const pdf = await pdfjsLib.getDocument({ data: pdfBytes.slice() }).promise;
  const page = await pdf.getPage(1), vp = page.getViewport({ scale: 1 });
  const W = Math.ceil(vp.width), H = Math.ceil(vp.height);
  // where the product table ends: the lowest page-1 text that matches a slip product
  const tc = await page.getTextContent();
  const keys = s.slip_lines.map(l => normP(l.product).slice(0, 18)).filter(k => k.length > 4);
  const rowsY = [];
  for (const it of tc.items) {
    if (!it.str || !it.str.trim()) continue;
    const y = it.transform[5]; let r = rowsY.find(r => Math.abs(r.y - y) < 3); if (!r) { r = { y, items: [] }; rowsY.push(r); }
    r.items.push(it);
  }
  let startY = 0;
  for (const r of rowsY) {
    const t = normP(r.items.sort((a, b) => a.transform[4] - b.transform[4]).map(i => i.str).join(' '));
    if (keys.some(k => t.startsWith(k))) startY = Math.max(startY, H - r.y + 4);
  }
  if (!startY) startY = H * .45;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
  await page.render({ canvasContext: ctx, viewport: vp }).promise;
  const px = ctx.getImageData(0, 0, W, H).data, x0 = 18, x1 = W - 18;
  const blank = y => { for (let x = x0; x < x1; x++) { const i = (y * W + x) * 4; if (px[i] * .3 + px[i + 1] * .59 + px[i + 2] * .11 < 225) return false; } return true; };
  const bands = []; let top = null;
  const yEnd = H - 40;                                                   // never write into the bottom margin
  for (let y = Math.ceil(startY); y <= yEnd; y++) {
    const b = y < yEnd && blank(y);
    if (b && top === null) top = y;
    if (!b && top !== null) { if (y - top > 22) bands.push({ top: top + 9, bottom: y - 3 }); top = null; }
  }
  return { W, H, bands };
}

async function buildSlipPdf(s, orig) {
  const { PDFDocument, StandardFonts, rgb } = PDFLib;
  const doc = await PDFDocument.load(orig);
  const font = await doc.embedFont(StandardFonts.Helvetica), bold = await doc.embedFont(StandardFonts.HelveticaBold);
  const groups = serialGroups(s), total = groups.reduce((a, g) => a + g.sns.length, 0);
  const info = { total, groups, extraPages: 0, placed: '' };
  if (!total) { info.placed = 'none'; return { bytes: await doc.save(), info }; }

  const p1 = doc.getPage(0), { width: W, height: H } = p1.getSize();
  const mx = 28, width = W - mx * 2;
  const rows = serialRows(groups, font, bold, width), need = rowsHeight(rows);
  const { bands } = await freeBands(orig, s);
  const fit = bands.find(b => b.bottom - b.top >= need);
  const flow = (pg, list, yTop) => { let y = yTop, lastHead = null;
    for (const r of list) { if (r.head) lastHead = r.head; r.draw(pg, mx, y); y -= r.h; } };

  if (fit) {                                                            // everything fits on the original page 1
    flow(p1, rows, H - fit.top); info.placed = 'page1';
    return { bytes: await doc.save(), info };
  }
  // Not enough room: short note on page 1 (if any gap), full list on added page(s)
  const gap = bands.find(b => b.bottom - b.top >= 14);
  if (gap) p1.drawText(pdfSafe(`Serial numbers (${total}): see the attached serial number page.`), { x: mx, y: H - gap.top - 10, size: 9, font: bold });
  const header = (pg, n) => {
    pg.drawText(pdfSafe(`Serial numbers - ${s.slip_ref}`), { x: mx, y: H - 48, size: 13, font: bold });
    const sub = [s.customer_name && 'Customer: ' + s.customer_name, s.so_ref && 'Order: ' + s.so_ref, s.slip_date && 'Date: ' + fmtDate(s.slip_date)].filter(Boolean).join('    ');
    pg.drawText(pdfSafe(sub), { x: mx, y: H - 64, size: 9, font });
    pg.drawLine({ start: { x: mx, y: H - 72 }, end: { x: W - mx, y: H - 72 }, thickness: 1, color: rgb(0, 0, 0) });
    pg.drawText(pdfSafe(`Attached to delivery slip ${s.slip_ref} - serial page ${n}`), { x: mx, y: 30, size: 8, font, color: rgb(.35, .35, .35) });
    return H - 84;
  };
  let pg = doc.addPage([W, H]), n = 1, y = header(pg, n);
  for (let i = 0; i < rows.length; i++) {
    const r = rows[i]; if (r.title) continue;                           // the page header replaces the serial title row
    if (y - r.h < 50) {
      pg = doc.addPage([W, H]); n++; y = header(pg, n);
      if (r.group !== undefined) {                                       // repeat the product heading on the new page
        pg.drawText(pdfSafe(r.headTxt + '  (continued)'), { x: mx, y: y - 8.5, size: 8, font: bold }); y -= 11; }
    }
    r.draw(pg, mx, y); y -= r.h;
  }
  info.placed = 'extra'; info.extraPages = n;
  return { bytes: await doc.save(), info };
}

function showSlipActions(s, out) {
  const { info } = out;
  const missing = info.groups.filter(g => g.sns.length < g.qty);
  const where = info.placed === 'page1' ? 'written on the original slip'
    : info.placed === 'extra' ? `on ${info.extraPages} added page${info.extraPages > 1 ? 's' : ''} (not enough room on the slip)` : '';
  S.pdfOut = { bytes: out.bytes, name: `Delivery Slip ${String(s.slip_ref).replace(/[\\/:*?"<>|]+/g, '-')} with serials.pdf` };
  openDlg(`<h3>${esc(s.slip_ref)} · ${esc(s.customer_name)}</h3>
    <div class="muted small" style="margin-bottom:10px">${info.total ? `<b>${info.total}</b> serial number(s) ${where}.` : 'No serials scanned yet. This is the plain Odoo slip.'}</div>
    ${missing.length ? `<div class="alert warn">${ic('warn')}<span>Not fully scanned: ${missing.map(g => `${esc(g.product)} (${g.sns.length} of ${g.qty})`).join(', ')}</span></div>` : ''}
    <div class="stack">
      <button class="btn pri" onclick="printPdfPages()">${ic('print')}Print</button>
      <button class="btn" onclick="sharePdf()">${ic('share')}Share to WhatsApp or email</button>
      <button class="btn" onclick="downloadPdf()">${ic('download')}Download PDF</button>
      <button class="btn" onclick="closeDlg()">Close</button>
    </div>`);
}
function pdfFile() { return new File([S.pdfOut.bytes], S.pdfOut.name, { type: 'application/pdf' }); }
function downloadPdf() {
  const url = URL.createObjectURL(new Blob([S.pdfOut.bytes], { type: 'application/pdf' }));
  const a = document.createElement('a'); a.href = url; a.download = S.pdfOut.name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
}
async function sharePdf() {
  const f = pdfFile();
  if (navigator.canShare && navigator.canShare({ files: [f] })) {
    try { await navigator.share({ files: [f], title: S.pdfOut.name }); } catch (e) { if (e.name !== 'AbortError') toast(errMsg(e), 'err'); }
  } else { toast('Sharing is not available on this device. Downloading instead.', 'warn'); downloadPdf(); }
}
// Phones can't print a PDF directly from a web page, so draw each page as a sharp image and print those
async function printPdfPages() {
  try {
    const pdf = await pdfjsLib.getDocument({ data: S.pdfOut.bytes.slice() }).promise, imgs = [];
    // print sheet = the PDF's own page size (points to mm); each image is drawn slightly smaller than the sheet
    // so rounding can never push it over and start an extra blank page
    const v1 = (await pdf.getPage(1)).getViewport({ scale: 1 }), mm = pt => (pt * 25.4 / 72).toFixed(2);
    const pw = mm(v1.width), ph = mm(v1.height);
    for (let p = 1; p <= pdf.numPages; p++) {
      const page = await pdf.getPage(p), vp = page.getViewport({ scale: 2.5 });
      const cv = document.createElement('canvas'); cv.width = vp.width; cv.height = vp.height;
      const ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
      await page.render({ canvasContext: ctx, viewport: vp }).promise;
      imgs.push(`<div class="p-page" style="width:${pw}mm;height:${(ph - 1.5).toFixed(2)}mm"><img src="${cv.toDataURL('image/png')}"></div>`);
    }
    const pa = $('#print-area'); pa.className = 'pdfpages'; pa.innerHTML = imgs.join('');
    $('#pageStyle').textContent = `@page{size:${pw}mm ${ph}mm;margin:0}`;
    closeDlg();
    await Promise.all([...pa.querySelectorAll('img')].map(i => i.decode ? i.decode().catch(() => {}) : null));
    setTimeout(() => window.print(), 100);
  } catch (e) { toast('Could not prepare the print: ' + errMsg(e), 'err'); }
}

/* =============================== DELIVERY STATUS =============================== */
// Five states, worked out from the serial progress and whether the slip was marked delivered
const STATE = {
  awaiting:  ['Not scanned', 'info'],
  scanning:  ['Scanning', 'warn'],
  ready:     ['Ready to dispatch', 'ok'],
  delivered: ['Delivered', 'done'],
  missing:   ['Serials missing', 'bad']
};
const CHIP = { '': 'All', awaiting: 'Not scanned', scanning: 'Scanning', ready: 'Ready', delivered: 'Delivered', missing: 'Serials missing' };
function slipState(s) {
  const p = progressOf(s);
  if (s.delivered_at) return p.got >= p.need ? 'delivered' : 'missing';
  if (!p.need) return 'ready';
  if (!p.got) return 'awaiting';
  return p.got >= p.need ? 'ready' : 'scanning';
}
function stateBadge(s) {
  const k = slipState(s), [label, cls] = STATE[k];
  return `<span class="badge st ${cls}">${label}</span>`;
}
const missingFn = e => /PGRST202|could not find the function|function .* does not exist|stock_|42883|42P01|PGRST205/i.test((e && (e.code + ' ' + e.message)) || '');
const v4Hint = e => missingFn(e) ? 'This needs the latest database update: run upgrade_v4.sql in Supabase.' : errMsg(e);

function delivInfo(s) {

    <div class="row" style="gap:6px"><b>${miss > 0 ? ic('warn') + ' Delivered, serials missing' : ic('check') + ' Delivered'}</b><span class="muted small">${fmtDT(s.delivered_at)}${s.delivered_by ? ' by ' + esc(s.delivered_by) : ''}</span></div>
    <dl class="result" style="margin:8px 0 0;font-size:14.5px">${s.receiver_name ? `<dt>Receiver</dt><dd><b>${esc(s.receiver_name)}</b></dd>` : ''}
      ${s.receiver_phone ? `<dt>Phone</dt><dd>${esc(s.receiver_phone)}</dd>` : ''}${s.receiver_plate ? `<dt>Plate no.</dt><dd>${esc(s.receiver_plate)}</dd>` : ''}
      ${s.delivery_note ? `<dt>Note</dt><dd>${esc(s.delivery_note)}</dd>` : ''}</dl>
    ${miss > 0 ? `<div class="small" style="color:var(--err);margin-top:4px">${miss} serial number${miss > 1 ? 's' : ''} still to capture. Scan them below to complete the record.</div>` : ''}

async function deliverSlip(id) {
  let s; try { s = await loadSlip(id); } catch (e) { return apiFail(e); }
  if (s.delivered_at) return toast('Already marked delivered', 'warn');
  const p = progressOf(s), miss = p.need - p.got;
  const lines = s.slip_lines.filter(l => +l.qty > 0);
  const brOpts = CONFIG.BRANCHES.map(b => `<option ${b === (S.me.branch || '') ? 'selected' : ''}>${esc(b)}</option>`).join('');

// Same rule as public.stock_key() in the database: the [CODE] identifies a product, else the tidied name
const stockKey = p => { const m = /^\s*\[([^\]]+)\]/.exec(p || ''); return m ? m[1].trim().toUpperCase() : String(p || '').trim().replace(/\s+/g, ' ').toLowerCase(); };
const fmtDay = d => { const x = new Date(d + 'T00:00:00'); return x.toLocaleDateString('en-GB', x.getFullYear() === new Date().getFullYear() ? { day: '2-digit', month: 'short' } : { day: '2-digit', month: 'short', year: '2-digit' }); };
const KIND = { opening: 'Opening stock', receipt: 'Receipt (Odoo)', manual_in: 'Stock in', delivery: 'Delivery', adjust: 'Adjustment' };
const fmtQ = q => { const n = Number(q) || 0; return (Math.round(n * 1000) / 1000).toLocaleString('en-GB'); };
const todayISO = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
function stockBranch() { if (ONE_BRANCH) return ONE_BRANCH; if (!S.stockBranch) S.stockBranch = S.me.branch && CONFIG.BRANCHES.includes(S.me.branch) ? S.me.branch : CONFIG.BRANCHES[0]; return S.stockBranch; }
function csvDownload(name, rows) {
  const csv = rows.map(r => r.map(c => { const s = String(c ?? ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(',')).join('\n');
  const url = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv' }));
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
}

async function importReceiptPdf(file) {
  const msg = $('#rcMsg');
  if (!window.pdfjsLib) return toast('PDF reader did not load. Check the internet connection.', 'err');
  msg.textContent = 'Reading PDF…';
  try {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const got = await readOdooPdf(new Uint8Array(await file.arrayBuffer()));
    const e = sinCollect();

    if (got.slip_date) e.date = got.slip_date;
    if (got.customer_name) e.party = got.customer_name;

  } catch (err) { msg.textContent = 'Could not read this PDF: ' + errMsg(err); }
}
// Read any Odoo stock document (delivery slip or receipt) into the same fields the slip reader produces
async function readOdooPdf(buf) {
  const pdf = await pdfjsLib.getDocument({ data: buf.slice() }).promise;
  const lines = []; let pageW = 595; const p1items = [];
  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await pdf.getPage(p); pageW = page.getViewport({ scale: 1 }).width;
    const tc = await page.getTextContent(); const rows = [];
    for (const it of tc.items) {
      if (!it.str || !it.str.trim()) continue;
      const x = it.transform[4], y = it.transform[5];
      let r = rows.find(r => Math.abs(r.y - y) < 3); if (!r) { r = { y, items: [] }; rows.push(r); }
      r.items.push({ x, y, s: it.str, w: it.width || 0 });
      if (p === 1) p1items.push({ x, y, s: it.str, w: it.width || 0 });
    }
    rows.sort((a, b) => b.y - a.y);
    for (const r of rows) { r.items.sort((a, b) => a.x - b.x); lines.push({ page: p, x: r.items[0].x, y: r.y, text: joinRun(r.items), items: r.items }); }
  }
  return interpretSlip(lines, pageW, p1items);
}

  if (!lines.length) return toast('Add at least one product with a quantity', 'warn');
  if (!e.date) return toast('Enter the date received', 'warn');
  if (e.kind === 'receipt' && !e.ref.trim()) return toast('Enter the receipt ref', 'warn');

    p_notes: e.notes, p_file: e.file, p_lines: lines });
  if (error) {
    btn.disabled = false; btn.textContent = 'Save stock in';
    return toast(error.code === '23505' ? `Receipt ${e.ref} is already recorded for ${e.branch}` : v4Hint(error), 'err', 6000);
  }
  toast(`Stock in saved: ${lines.length} line(s)`, 'ok'); S.stockBranch = e.branch; S.stockSub = 'bal'; go('stock');
}

async function readStockExport(file) {
  if (!window.XLSX) return toast('Spreadsheet reader did not load. Check the internet connection.', 'err');
  try {
    const wb = XLSX.read(new Uint8Array(await file.arrayBuffer()), { type: 'array' });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const all = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' });
    const hi = all.slice(0, 15).findIndex(r => r.some(c => /product/i.test(String(c))));
    if (hi < 0) return toast('No "Product" column found in the first sheet', 'err', 5000);
    const head = all[hi].map(c => String(c).trim());
    const find = (good, bad) => head.findIndex(h => good.test(h) && !(bad && bad.test(h)));
    let qc = find(/on ?hand/i); if (qc < 0) qc = find(/quantity|qty/i, /reserved|forecast|incoming|outgoing|available|uom|unit/i);
    const o = S.opn;
    Object.assign(o, { file: file.name, head, data: all.slice(hi + 1).filter(r => r.some(c => String(c).trim() !== '')),
      pc: find(/^product$|product name|^product\b/i, /categ|uom|unit|id$|type/i), qc, lc: find(/location|warehouse/i), locs: null });
    if (o.pc < 0) o.pc = find(/product/i);
    buildOpening();
  } catch (err) { toast('Could not read the file: ' + errMsg(err), 'err', 5000); }
}
function buildOpening() {
  const o = S.opn;
  const num = v => typeof v === 'number' ? v : parseFloat(String(v).replace(/,/g, '')) || 0;
  if (o.lc >= 0 && !o.locs) {
    const names = [...new Set(o.data.map(r => String(r[o.lc]).trim() || '(blank)'))], hint = CONFIG.OPENING_LOCATIONS;
    const anyOurs = hint && names.some(n => hint.test(n));
    o.locs = {}; names.forEach(n => { o.locs[n] = anyOurs ? hint.test(n) : true; });   // pre-tick only this warehouse's locations
  }
  const agg = new Map();
  for (const r of o.data) {
    if (o.lc >= 0 && !o.locs[String(r[o.lc]).trim() || '(blank)']) continue;
    const name = String(r[o.pc] ?? '').trim(); if (!name || o.pc < 0 || o.qc < 0) continue;
    const k = stockKey(name), cur = agg.get(k) || { product: name, qty: 0 };
    cur.qty += num(r[o.qc]); agg.set(k, cur);
  }
  o.rows = [...agg.values()].filter(x => Math.abs(x.qty) > 1e-9).sort((a, b) => a.product.localeCompare(b.product));
  drawOpening();
}
function drawOpening() {
  const o = S.opn, opt = sel => o.head.map((h, i) => `<option value="${i}" ${i === sel ? 'selected' : ''}>${esc(h || 'Column ' + (i + 1))}</option>`).join('');
  const tot = o.rows.reduce((a, r) => a + r.qty, 0), neg = o.rows.filter(r => r.qty < 0).length;
  $('#opBody').innerHTML = `<div class="card stack" style="margin-bottom:12px"><div class="muted small">Read from <b>${esc(o.file)}</b>. Check the columns:</div>
      <div class="grid2"><div><label>Product column</label><select id="opPc"><option value="-1">—</option>${opt(o.pc)}</select></div>
        <div><label>Quantity column</label><select id="opQc"><option value="-1">—</option>${opt(o.qc)}</select></div>
        <div><label>Location column</label><select id="opLc"><option value="-1">None</option>${opt(o.lc)}</select></div></div>
      ${o.lc >= 0 && o.locs ? `<div><label>Locations that belong to ${esc(o.branch)} (untick any other warehouse)</label>${Object.keys(o.locs).map(l =>
        `<label class="row small" style="font-weight:400"><input type="checkbox" data-loc="${esc(l)}" ${o.locs[l] ? 'checked' : ''} style="width:auto"> ${esc(l)}</label>`).join('')}</div>` : ''}</div>
    <div class="card" style="margin-bottom:12px"><div class="row"><b class="grow">${o.rows.length} product(s), total ${fmtQ(tot)}</b>${neg ? `<span class="badge bad">${neg} negative</span>` : ''}</div>
      <table class="reg" style="margin-top:6px"><tbody>${o.rows.slice(0, 60).map(r => `<tr><td>${esc(r.product)}</td><td class="n ${r.qty < 0 ? 'neg' : ''}">${fmtQ(r.qty)}</td></tr>`).join('')}
      ${o.rows.length > 60 ? `<tr><td colspan="2" class="muted">…and ${o.rows.length - 60} more</td></tr>` : ''}</tbody></table></div>
    <div class="row"><div class="grow"></div><button class="btn pri" id="opSave" ${o.rows.length ? '' : 'disabled'}>Import as opening stock</button></div>`;
  $('#opPc').onchange = ev => { o.pc = +ev.target.value; buildOpening(); };
  $('#opQc').onchange = ev => { o.qc = +ev.target.value; buildOpening(); };
  $('#opLc').onchange = ev => { o.lc = +ev.target.value; o.locs = null; buildOpening(); };
  document.querySelectorAll('[data-loc]').forEach(c => c.onchange = () => { o.locs[c.dataset.loc] = c.checked; buildOpening(); });
  $('#opSave').onclick = saveOpening;
}
async function saveOpening() {

  if (!confirm(`${op ? `This REPLACES the ${o.branch} opening stock imported ${fmtDT(op.created_at)}.\n\n` : ''}Import ${o.rows.length} product(s) as the ${o.branch} opening stock?\n\nDeliveries and stock-ins recorded before now stay listed but are not counted again, because the Odoo figures already include them.`)) return;

}

// Plain-language verdict for engineers at the repair desk
function ageText(iso) {
  if (!iso) return '';
  const d = new Date(iso + 'T00:00:00'), n = new Date();
  let m = (n.getFullYear() - d.getFullYear()) * 12 + (n.getMonth() - d.getMonth()); if (n.getDate() < d.getDate()) m--;
  if (m < 1) { const days = Math.max(0, Math.floor((n - d) / 864e5)); return days === 0 ? 'today' : days + ' day' + (days === 1 ? '' : 's') + ' ago'; }
  const y = Math.floor(m / 12), r = m % 12;
  return [y ? y + ' year' + (y > 1 ? 's' : '') : '', r ? r + ' month' + (r > 1 ? 's' : '') : ''].filter(Boolean).join(' ') + ' ago';
}
function soldHtml(d) {
  const st = d.status === 'replaced' ? 'This unit was later replaced and taken back.' : d.status === 'returned' ? 'This unit was later returned to us.' : '';
  return `<div class="verdict ok">${ic('check')}<div><b class="vt">Sold by Solartech</b>
    <div>Sold ${fmtDate(d.slip_date)}${d.slip_date ? ` (${ageText(d.slip_date)})` : ''} to ${esc(d.customer_name)}, slip ${esc(d.slip_ref)}.</div>
    ${st ? `<div style="margin-top:4px"><b>${st}</b></div>` : ''}</div></div>`;
}

}

async function doSearch(q) {
  q = String(q || '').trim(); S.lastSearch = q; const box = $('#sRes'); if (!box) return;
  if (!q) { box.innerHTML = ''; return; }
  box.innerHTML = '<div class="empty">Searching…</div>';
  const safe = q.replace(/[,()*%]/g, ' ').trim(), sn = extractSerial(q).replace(/[,()*%]/g, '');
  const { data, error } = await S.sb.from('serial_lookup').select('*')
    .or(`serial.ilike.%${sn}%,customer_name.ilike.%${safe}%,customer_phone.ilike.%${safe}%,slip_ref.ilike.%${safe}%,so_ref.ilike.%${safe}%`)
    .order('scanned_at', { ascending: false }).limit(100);
  if (!$('#sRes')) return;
  if (error) { box.innerHTML = `<div class="alert err">${ic('warn')}<span>${esc(error.message)}</span></div>`; return; }
  const looksSerial = /\d/.test(sn) && !/\s/.test(q.trim()) && sn.length >= 6 && !/^(\+?234|0)[789]\d{9}$/.test(q.trim()) && !/\/(OUT|IN)\//i.test(q);

        ${d.replaced_by ? `<dt>Replaced by</dt><dd class="mono">${esc(d.replaced_by)}</dd>` : ''}
      </dl>
      <div class="row" style="margin-top:10px">
        <button class="btn sm" onclick="historyDlg(${i})">${ic('clock')}History</button>

async function exportCsv() {
  toast('Preparing export…');
  const rows = []; let from = 0;
  while (true) {
    const { data, error } = await S.sb.from('serial_lookup').select('*').order('scanned_at', { ascending: true }).range(from, from + 999);
    if (error) return apiFail(error);
    rows.push(...data); if (data.length < 1000) break; from += 1000;
  }
  const cols = ['serial', 'status', 'product', 'customer_name', 'customer_phone', 'customer_address', 'slip_ref', 'so_ref', 'slip_date', 'branch',
                'replaces', 'replaced_by', 'scanned_by', 'scanned_at', 'raw_code'];
  const cell = v => { v = v == null ? '' : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  const csv = '﻿' + [cols.join(','), ...rows.map(r => cols.map(c => cell(r[c])).join(','))].join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = `serials_${new Date().toISOString().slice(0, 10)}.csv`; document.body.appendChild(a); a.click(); a.remove();
  toast(`Exported ${rows.length} serial(s)`, 'ok');
}
